name: PR Schema Comment

on:
  pull_request:

jobs:
  schema-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630cea9ddb9b8250add8861fc # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@4237ab43a313034440161af4b77bdf08aa494704 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install SchemaWatch from PR
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run SchemaWatch
        id: schemawatch
        run: |
          schemawatch examples/old.yaml examples/new.yaml --format markdown --output report.md
        continue-on-error: true

      - name: Comment PR
        if: hashFiles('report.md') != ''
        uses: actions/github-script@60a0d83039a2181ad02dd71c10b5e88909beedc2 # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
